# Название всего автоматического процесса
name: Unity 2D Platformer CI/CD

# Условие запуска: реагировать на любой push в главную ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  # ЗАДАЧА 1: Быстрая диагностика структуры проекта (Sanity Check)
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettingz" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packagez" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  # ЭТАП 2 (ЛР №4): Автоматический запуск тестов Unity
  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # Кэш папки Library, чтобы повторные запуски были быстрее
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Официальный CLI GameCI с фиксированной версией
      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      # Запуск тестов EditMode и PlayMode в контейнере unityci/editor.
      # Coverage отключен: на Unity 6 он роняет редактор в контейнере (SIGSEGV, exit code 139).
      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.3.11f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # Сохраняем результаты тестов даже при падении
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  # НОВЫЙ ЭТАП (ЛР №5): Настоящая компиляция игры в облаке
  build_game:
    needs: run_tests # Запустится только если тесты из ЛР №4 прошли успешно
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # В игре могут быть тяжелые бинарные ассеты

      # Кэшируем Library, чтобы повторные сборки шли 2-3 минуты, а не 25-30
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Облачный компилятор Unity 6 от GameCI
      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # Вызов C# метода автоматизации из ЛР №1
          buildMethod: BuildManager.BuildWebGL
          # Версия Unity указывается явно: ProjectVersion.txt закрыт .gitignore
          unityVersion: 6000.3.11f1

      # Сохраняем НАСТОЯЩИЕ скомпилированные файлы во временное облачное хранилище
      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  # ЗАДАЧА 2: Автоматическое зеркалирование в резервный репозиторий
  mirror_repo:
    needs: run_tests # Только после успешных тестов
    if: github.repository == 'TFIDHB/Lab1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== ОШИБКА: BACKUP_TOKEN is empty! Create a PAT with scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/TFIDHB/Lab2.git main
          echo "=== Код успешно продублирован ==="

  # ЭТАП 4 (ЛР №5): Сборка Docker-образа с НАСТОЯЩЕЙ игрой
  build_docker_image:
    needs: build_game # Теперь ждем полноценного билда игры
    if: github.repository == 'TFIDHB/Lab1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Вместо генерации заглушек (touch) скачиваем живой билд из build_game
      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tfidhb/platformer-game:latest
            ghcr.io/tfidhb/platformer-game:${{ github.sha }}

  # ЭТАП 5 (ЛР №5): Автоматический деплой игры на GitHub Pages
  deploy_to_pages:
    needs: build_game # Деплоим только успешно собранную игру
    if: github.repository == 'TFIDHB/Lab1'
    runs-on: ubuntu-latest
    # Публикация в ветку gh-pages требует прав на запись содержимого репозитория
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      # Публикуем папку Builds/WebGL в служебную ветку gh-pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages

  # ЭТАП 6 (ЛР №6): Telegram-оповещения о результатах пайплайна
  notify:
    needs: [ sanity_check, run_tests, build_game, mirror_repo, build_docker_image, deploy_to_pages ]
    # always(): задача выполняется при любом исходе остальных (аналог after_script).
    # Проверка репозитория не даёт уведомлению сработать в резервном Lab2, где нет секретов.
    if: always() && github.repository == 'TFIDHB/Lab1'
    runs-on: ubuntu-latest
    steps:
      # Определяем первую упавшую (не success) задачу; если таких нет, stage=none
      - name: Determine pipeline status
        id: status
        env:
          R_SANITY: ${{ needs.sanity_check.result }}
          R_TESTS: ${{ needs.run_tests.result }}
          R_BUILD: ${{ needs.build_game.result }}
          R_MIRROR: ${{ needs.mirror_repo.result }}
          R_DOCKER: ${{ needs.build_docker_image.result }}
          R_PAGES: ${{ needs.deploy_to_pages.result }}
        run: |
          stage=none
          for pair in "sanity_check:$R_SANITY" "run_tests:$R_TESTS" "build_game:$R_BUILD" \
                      "mirror_repo:$R_MIRROR" "build_docker_image:$R_DOCKER" "deploy_to_pages:$R_PAGES"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != "success" ]; then
              stage="$name"
              break
            fi
          done
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      # Webhook: POST-запрос с JSON-нагрузкой в Telegram Bot API.
      # Токен и chat_id берутся только из секретов, в логе они маскируются.
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE: ${{ steps.status.outputs.stage }}
          SITE_URL: "https://tfidhb.github.io/Lab1/"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ "$STAGE" = "none" ]; then
            TEXT=$(printf '✅ Сборка Lab1 завершена успешно.\nАвтор коммита: %s\nИгра доступна: %s\nПрогон: %s' "$AUTHOR" "$SITE_URL" "$RUN_URL")
          else
            TEXT=$(printf '❌ Сборка Lab1 упала на задаче %s.\nАвтор коммита: %s\nЛог прогона: %s' "$STAGE" "$AUTHOR" "$RUN_URL")
          fi
          # jq корректно экранирует спецсимволы (кавычки, переводы строк) в JSON
          jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" '{chat_id: $chat_id, text: $text}' \
            | curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d @-
